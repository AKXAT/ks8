<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        h3 {
            margin: 20px 0 10px;
            color: #555;
        }

        ul {
            list-style: none;
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        li {
            padding: 10px;
            margin-bottom: 8px;
            background: #f5f7ff;
            border-radius: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.4);
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logout-btn {
            width: auto;
            padding: 8px 12px;
            font-size: 13px;
            background: #e53e3e;
        }

        .logout-btn:hover {
            background: #c53030;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="top-bar">
            <h2>Users</h2>
            <button class="logout-btn" onclick="goHome()">← Back</button>
        </div>

        <ul id="users"></ul>

        <h3>Add User</h3>
        <input id="name" placeholder="Name">
        <input id="email" placeholder="Email">
        <button onclick="addUser()">Add User</button>

    </div>

    <script>
        async function loadUsers() {
            const res = await fetch('/dashboard');
            const data = await res.json();

            const list = document.getElementById('users');
            list.innerHTML = '';

            data.users.forEach(user => {
                const li = document.createElement('li');
                li.innerText = user.name + " - " + user.email;
                list.appendChild(li);
            });
        }

        async function addUser() {
            await fetch('/update_dashboard', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value
                })
            });

            loadUsers();
        }

        function goHome() {
            window.location.href = '/';
        }

        loadUsers();
    </script>

</body>
</html>
